<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartamentos | Reportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --ink: #17324d; --aqua: #0c8d87; --paper: #f4f7f6; --accent: #e5a93f; }
        body { background: var(--paper); color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
        .navbar { background: var(--ink); }
        .brand-mark { color: var(--accent) !important; font-weight: 700; letter-spacing: 1px; }
        .nav-links a { color: #fff; text-decoration: none; margin-left: 1.25rem; opacity: .75; }
        .nav-links a:hover, .nav-links a.active { opacity: 1; }
        .nav-links a.active { border-bottom: 2px solid var(--accent); padding-bottom: 2px; }
        .page-header { border-bottom: 3px solid var(--accent); }
        .panel { background: #fff; border: 1px solid #d9e1df; border-radius: 6px; box-shadow: 0 8px 20px rgb(23 50 77 / 8%); }
        .table thead th { color: #fff; background: var(--ink); white-space: nowrap; }
        .btn-primary { background: var(--aqua); border-color: var(--aqua); }
        .btn-primary:hover { background: #08736e; border-color: #08736e; }
        .btn-outline-primary { color: var(--aqua); border-color: var(--aqua); }
        .btn-outline-primary:hover { background: var(--aqua); border-color: var(--aqua); }
        .form-control:focus, .form-select:focus { border-color: var(--aqua); box-shadow: 0 0 0 .2rem rgb(12 141 135 / 18%); }
        .modulo { display: block; color: inherit; text-decoration: none; transition: transform .15s, box-shadow .15s; }
        .modulo:hover { transform: translateY(-3px); box-shadow: 0 12px 26px rgb(23 50 77 / 14%); color: inherit; }
        .modulo .icono { font-size: 1.8rem; }
        .kpi { font-size: 2rem; font-weight: 700; color: var(--aqua); }
        .miniatura { width: 64px; height: 44px; object-fit: cover; border-radius: 4px; background: #e9eeed; }
        @media (max-width: 767px) { .table { font-size: .86rem; } .nav-links a { margin-left: .75rem; } }
    </style>
</head>
<body>
    <div id="nav"></div>
    <main class="container pb-5" id="app"></main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        'use strict';

        const NAV = [
            ['index.html', 'Inicio'], ['clientes.html', 'Clientes'], ['propiedades.html', 'Propiedades'],
            ['habitaciones.html', 'Habitaciones'], ['disponibilidad.html', 'Disponibilidad'],
            ['reservas.html', 'Reservas'], ['pagos.html', 'Pagos'], ['reportes.html', 'Reportes']
        ];

        function esc(v) {
            return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function humanize(s) {
            const t = String(s ?? '').replace(/_/g, ' ').toLowerCase();
            return t.charAt(0).toUpperCase() + t.slice(1);
        }
        const moneyFmt = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });
        function money(n) { return n === null || n === undefined ? '—' : moneyFmt.format(n); }
        function fecha(d) { return d ? String(d).split('-').reverse().join('/') : '—'; }
        function fechaIso(d) {
            const p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
        }
        const COLORES_ESTADO = {
            ACTIVO: 'success', DISPONIBLE: 'success', CONFIRMADA: 'success', PAGADO: 'success',
            PENDIENTE: 'warning', SUSPENDIDO: 'warning', MANTENIMIENTO: 'warning',
            CANCELADA: 'secondary', CANCELADO: 'secondary', INACTIVO: 'secondary', NO_DISPONIBLE: 'danger',
            COMPLETADA: 'info', OCUPADA: 'primary', PROPIETARIO: 'dark', CLIENTE: 'primary', EMPRESA: 'info',
            CASA: 'info', PISO: 'primary'
        };
        function badge(valor, texto) {
            return `<span class="badge text-bg-${COLORES_ESTADO[valor] || 'secondary'}">${esc(texto || humanize(valor))}</span>`;
        }

        /* ---------- API ---------- */
        async function api(metodo, url, cuerpo) {
            const opciones = { method: metodo, headers: {} };
            if (cuerpo !== undefined) {
                opciones.headers['Content-Type'] = 'application/json';
                opciones.body = JSON.stringify(cuerpo);
            }
            const res = await fetch(url, opciones);
            if (res.status === 204) return null;
            const texto = await res.text();
            let datos = null;
            if (texto) { try { datos = JSON.parse(texto); } catch (e) { datos = null; } }
            if (!res.ok) {
                const error = new Error((datos && datos.mensaje) || `Error ${res.status}`);
                error.detalles = (datos && datos.detalles) || [];
                error.status = res.status;
                throw error;
            }
            return datos;
        }

        function renderNav() {
            const actual = location.pathname.split('/').pop() || 'index.html';
            const enlaces = NAV.map(([href, texto]) => `<a href="${href}" class="${href === actual ? 'active' : ''}">${texto}</a>`).join('');
            document.getElementById('nav').innerHTML = `
                <nav class="navbar navbar-expand-lg navbar-dark mb-4"><div class="container flex-wrap">
                    <a class="navbar-brand brand-mark" href="index.html">APARTAMENTOS</a>
                    <div class="nav-links ms-auto">${enlaces}</div>
                </div></nav>`;
        }

        function showAlert(tipo, mensaje, detalles = []) {
            const modal = document.querySelector('#modalGenerico.show');
            const contenedor = modal ? modal.querySelector('.modal-alert') : document.getElementById('alertas');
            if (!contenedor) return;
            const lista = detalles.length ? `<ul class="mb-0 mt-2">${detalles.map(d => `<li>${esc(d)}</li>`).join('')}</ul>` : '';
            contenedor.innerHTML = `<div class="alert alert-${tipo} alert-dismissible fade show" role="alert">
                <div>${esc(mensaje)}${lista}</div><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
            if (!modal) window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        function showError(e) { showAlert('danger', e.message || 'Error inesperado', e.detalles || []); }

        function abrirModal(titulo, cuerpoHtml, pieHtml = '') {
            let el = document.getElementById('modalGenerico');
            if (!el) {
                document.body.insertAdjacentHTML('beforeend', `
                    <div class="modal fade" id="modalGenerico" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-scrollable">
                        <div class="modal-content">
                            <div class="modal-header"><h3 class="modal-title fs-5"></h3><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                            <div class="modal-body"><div class="modal-alert"></div><div class="modal-contenido"></div></div>
                            <div class="modal-footer"></div>
                        </div></div></div>`);
                el = document.getElementById('modalGenerico');
            }
            el.querySelector('.modal-title').textContent = titulo;
            el.querySelector('.modal-alert').innerHTML = '';
            el.querySelector('.modal-contenido').innerHTML = cuerpoHtml;
            const pie = el.querySelector('.modal-footer');
            pie.innerHTML = pieHtml;
            pie.style.display = pieHtml ? '' : 'none';
            const instancia = bootstrap.Modal.getOrCreateInstance(el);
            instancia.show();
            return { el: el.querySelector('.modal-contenido'), raiz: el, cerrar: () => instancia.hide() };
        }

        const normalizar = o => (typeof o === 'object' && o !== null) ? o : { value: o, label: humanize(o) };

        async function cargarOpciones(campo, valores) {
            if (Array.isArray(campo.options)) return campo.options.map(normalizar);
            if (typeof campo.options === 'function') return (await campo.options(valores || {})).map(normalizar);
            return [];
        }

        async function poblarSelect(select, campo, valores, seleccionado) {
            let opciones = [];
            try { opciones = await cargarOpciones(campo, valores); } catch (e) { showError(e); }
            const vacio = campo.emptyLabel || 'Seleccione…';
            select.innerHTML = `<option value="">${esc(vacio)}</option>` +
                opciones.map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('');
            if (seleccionado !== undefined && seleccionado !== null) select.value = String(seleccionado);
        }

        function campoHtml(f, prefijo) {
            const id = prefijo + f.name;
            const req = f.required ? 'required' : '';
            const etiqueta = `<label class="form-label" for="${id}">${esc(f.label)}${f.required ? ' *' : ''}</label>`;
            let control;
            if (f.type === 'select') {
                control = `<select class="form-select" id="${id}" name="${f.name}" ${req}></select>`;
            } else if (f.type === 'textarea') {
                control = `<textarea class="form-control" id="${id}" name="${f.name}" rows="2" ${req} ${f.maxlength ? `maxlength="${f.maxlength}"` : ''}></textarea>`;
            } else {
                const attrs = ['min', 'max', 'step', 'maxlength', 'pattern', 'placeholder', 'title']
                    .filter(a => f[a] !== undefined).map(a => `${a}="${esc(f[a])}"`).join(' ');
                control = `<input class="form-control" id="${id}" name="${f.name}" type="${f.type || 'text'}" ${attrs} ${req}>`;
            }
            return `<div class="mb-3">${etiqueta}${control}${f.ayuda ? `<div class="form-text">${esc(f.ayuda)}</div>` : ''}</div>`;
        }

        function leerCampos(contenedor, campos) {
            const valores = {};
            for (const f of campos) {
                const el = contenedor.querySelector(`[name="${f.name}"]`);
                if (!el) continue;
                let v = el.value.trim();
                if (v === '') v = null;
                else if (f.type === 'number') v = Number(v);
                valores[f.name] = v;
            }
            return valores;
        }

        async function asignarCampos(contenedor, campos, valores) {
            for (const f of campos) {
                const el = contenedor.querySelector(`[name="${f.name}"]`);
                let v = valores[f.name];
                if (v === undefined || v === null) v = f.default ?? '';
                if (f.type === 'select') await poblarSelect(el, f, leerCampos(contenedor, campos), v);
                else el.value = v;
            }
        }

        async function montarCampos(contenedor, campos, prefijo, valores = {}) {
            contenedor.innerHTML = campos.map(f => campoHtml(f, prefijo)).join('');
            if (prefijo === 'e-') {
                campos.filter(f => f.soloLecturaAlEditar).forEach(f => { contenedor.querySelector(`[name="${f.name}"]`).disabled = true; });
            }
            await asignarCampos(contenedor, campos, valores);
            for (const f of campos.filter(c => c.dependsOn)) {
                const padre = contenedor.querySelector(`[name="${f.dependsOn}"]`);
                const hijo = contenedor.querySelector(`[name="${f.name}"]`);
                padre.addEventListener('change', () => poblarSelect(hijo, f, leerCampos(contenedor, campos), null));
            }
        }

        const nombreDe = c => `${c.nombres} ${c.apellidos}`;
        const opciones = {
            propiedades: async () => (await api('GET', '/api/propiedades')).map(p => ({ value: p.id, label: `#${p.id} · ${p.titulo}` })),
            propietarios: async () => (await api('GET', '/api/clientes?estatus=ACTIVO'))
                .filter(c => c.tipo !== 'CLIENTE').map(c => ({ value: c.id, label: `${nombreDe(c)} (${humanize(c.tipo)})` })),
            arrendatarios: async () => (await api('GET', '/api/clientes?estatus=ACTIVO'))
                .filter(c => c.tipo !== 'PROPIETARIO').map(c => ({ value: c.id, label: `${nombreDe(c)} (${humanize(c.tipo)})` })),
            clientes: async () => (await api('GET', '/api/clientes')).map(c => ({ value: c.id, label: nombreDe(c) })),
            habitacionesDe: async v => v.propiedadId
                ? (await api('GET', `/api/habitaciones?propiedadId=${v.propiedadId}`))
                    .map(h => ({ value: h.id, label: `${h.numero}${h.nombre ? ' · ' + h.nombre : ''} (${humanize(h.tipo)})` }))
                : [],
            reservasActivas: async () => (await api('GET', '/api/reservas')).filter(r => r.estado !== 'CANCELADA')
                .map(r => ({ value: r.id, label: `#${r.id} · ${nombreDe(r.cliente)} · ${r.propiedad.titulo} (${fecha(r.fechaInicio)} → ${fecha(r.fechaFin)})` }))
        };

        async function crudPage(cfg) {
            renderNav();
            const singular = cfg.singular;
            const filtros = cfg.filters || [];
            const camposEdicion = cfg.editFields ? cfg.fields.filter(f => cfg.editFields.includes(f.name)) : cfg.fields;
            const payload = valores => cfg.toPayload ? cfg.toPayload(valores)
                : Object.fromEntries(cfg.fields.map(f => [f.name, valores[f.name] ?? null]));
            let filas = [];

            document.getElementById('app').innerHTML = `
                <header class="page-header d-flex justify-content-between align-items-end mb-4 pb-3">
                    <div><p class="text-uppercase small mb-1 text-secondary">Administración</p><h1 class="h2 mb-0">${esc(cfg.titulo)}</h1></div>
                    <span class="badge text-bg-light border" id="contador">0 registrados</span>
                </header>
                <div id="alertas"></div>
                <div class="row g-4">
                    <section class="col-lg-4">
                        <div class="panel p-4">
                            <h2 class="h5 mb-3">Registrar ${esc(singular.toLowerCase())}</h2>
                            <form id="formCrear"><div id="camposCrear"></div><button class="btn btn-primary w-100" type="submit">Guardar ${esc(singular.toLowerCase())}</button></form>
                        </div>
                        <div id="panelesExtra"></div>
                    </section>
                    <section class="col-lg-8">
                        <div class="panel p-3 p-md-4">
                            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                                <h2 class="h5 mb-0">Listado</h2>
                                <input id="buscador" class="form-control form-control-sm w-auto" type="search" placeholder="Buscar en la tabla">
                            </div>
                            <div class="row g-2 mb-3" id="filtros"></div>
                            <div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead id="encabezado"></thead><tbody id="cuerpo"></tbody></table></div>
                        </div>
                    </section>
                </div>`;

            const camposCrear = document.getElementById('camposCrear');
            const tbody = document.getElementById('cuerpo');

            /* tabla */
            document.getElementById('encabezado').innerHTML =
                `<tr>${cfg.columns.map(c => `<th>${esc(c.label)}</th>`).join('')}<th class="text-end">Acciones</th></tr>`;

            function accionesHtml(r, i) {
                const botones = [];
                if (!cfg.sinEdicion && (!cfg.puedeEditar || cfg.puedeEditar(r)))
                    botones.push(`<button class="btn btn-outline-primary btn-sm" data-accion="editar" data-i="${i}">Editar</button>`);
                (cfg.acciones ? cfg.acciones(r) : []).forEach((a, j) =>
                    botones.push(`<button class="btn ${a.cls || 'btn-outline-secondary'} btn-sm" data-accion="extra" data-i="${i}" data-j="${j}">${esc(a.label)}</button>`));
                if (!cfg.puedeEliminar || cfg.puedeEliminar(r))
                    botones.push(`<button class="btn btn-outline-danger btn-sm" data-accion="eliminar" data-i="${i}">Eliminar</button>`);
                return botones.join(' ');
            }

            function dibujarTabla() {
                document.getElementById('contador').textContent = `${filas.length} registrados`;
                tbody.innerHTML = filas.length
                    ? filas.map((r, i) => `<tr>${cfg.columns.map(c => `<td>${c.render(r)}</td>`).join('')}<td class="text-end text-nowrap">${accionesHtml(r, i)}</td></tr>`).join('')
                    : `<tr><td colspan="${cfg.columns.length + 1}" class="text-center text-secondary py-4">No hay ${esc(cfg.titulo.toLowerCase())} registrados.</td></tr>`;
                aplicarBusqueda();
            }

            function aplicarBusqueda() {
                const q = document.getElementById('buscador').value.toLowerCase();
                tbody.querySelectorAll('tr').forEach(tr => {
                    if (tr.cells.length < 2) return;
                    const texto = Array.from(tr.cells).slice(0, -1).map(c => c.textContent).join(' ').toLowerCase();
                    tr.style.display = texto.includes(q) ? '' : 'none';
                });
            }
            document.getElementById('buscador').addEventListener('input', aplicarBusqueda);

            async function cargar() {
                const params = new URLSearchParams();
                for (const f of filtros) {
                    const el = document.getElementById('filtro-' + f.name);
                    const valor = f.type === 'checkbox' ? (el.checked ? 'true' : '') : el.value.trim();
                    if (valor) params.append(f.name, valor);
                }
                const qs = params.toString();
                try { filas = await api('GET', cfg.endpoint + (qs ? '?' + qs : '')); }
                catch (e) { showError(e); filas = []; }
                dibujarTabla();
            }
            const ctx = { recargar: cargar, ok: msg => showAlert('success', msg) };

            const contFiltros = document.getElementById('filtros');
            contFiltros.innerHTML = filtros.map(f => f.type === 'checkbox'
                ? `<div class="col-auto d-flex align-items-end"><div class="form-check mb-1"><input class="form-check-input" type="checkbox" id="filtro-${f.name}"><label class="form-check-label small" for="filtro-${f.name}">${esc(f.label)}</label></div></div>`
                : `<div class="col-sm-6 col-md-4"><label class="form-label small mb-1" for="filtro-${f.name}">${esc(f.label)}</label>${f.type === 'text'
                    ? `<input class="form-control form-control-sm" id="filtro-${f.name}" placeholder="${esc(f.placeholder || '')}">`
                    : `<select class="form-select form-select-sm" id="filtro-${f.name}"></select>`}</div>`).join('');
            for (const f of filtros) {
                const el = document.getElementById('filtro-' + f.name);
                if (f.type !== 'checkbox' && f.type !== 'text') await poblarSelect(el, { options: f.options, emptyLabel: 'Todos' }, {}, '');
                el.addEventListener(f.type === 'text' ? 'change' : 'change', cargar);
            }

            await montarCampos(camposCrear, cfg.fields, 'c-', {});
            document.getElementById('formCrear').addEventListener('submit', async ev => {
                ev.preventDefault();
                try {
                    await api('POST', cfg.endpoint, payload(leerCampos(camposCrear, cfg.fields)));
                    showAlert('success', `${singular} registrado correctamente.`);
                    await asignarCampos(camposCrear, cfg.fields, {});
                    await cargar();
                } catch (e) { showError(e); }
            });

            async function editar(r) {
                const base = cfg.fromRow ? cfg.fromRow(r) : r;
                const m = abrirModal(`Editar ${singular.toLowerCase()}`, '<form id="formEditar"><div id="camposEditar"></div></form>',
                    '<button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" type="submit" form="formEditar">Guardar cambios</button>');
                const cont = m.el.querySelector('#camposEditar');
                await montarCampos(cont, camposEdicion, 'e-', base);
                m.el.querySelector('#formEditar').addEventListener('submit', async ev => {
                    ev.preventDefault();
                    try {
                        await api('PUT', `${cfg.endpoint}/${r.id}`, payload({ ...base, ...leerCampos(cont, camposEdicion) }));
                        m.cerrar();
                        showAlert('success', `${singular} actualizado correctamente.`);
                        await cargar();
                    } catch (e) { showError(e); }
                });
            }

            tbody.addEventListener('click', async ev => {
                const boton = ev.target.closest('button[data-accion]');
                if (!boton) return;
                const r = filas[Number(boton.dataset.i)];
                try {
                    if (boton.dataset.accion === 'editar') await editar(r);
                    else if (boton.dataset.accion === 'extra') await cfg.acciones(r)[Number(boton.dataset.j)].handler(r, ctx);
                    else if (confirm(`¿Eliminar ${singular.toLowerCase()} #${r.id}?`)) {
                        await api('DELETE', `${cfg.endpoint}/${r.id}`);
                        showAlert('success', `${singular} eliminado correctamente.`);
                        await cargar();
                    }
                } catch (e) { showError(e); }
            });

            if (cfg.paneles) await cfg.paneles(document.getElementById('panelesExtra'));
            await cargar();
        }
    </script>
    <script>
renderNav();
const hoy = new Date();
const mesInicio = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
const mesSiguiente = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 1);
const camposRango = (hastaLabel) => [
    { name: 'desde', label: 'Desde', type: 'date', required: true },
    { name: 'hasta', label: hastaLabel, type: 'date', required: true },
    { name: 'propiedadId', label: 'Propiedad', type: 'select', options: opciones.propiedades, emptyLabel: 'Todas' }
];
const camposOcupacion = camposRango('Hasta (exclusivo)');
const camposIngresos = camposRango('Hasta (incluido)');

document.getElementById('app').innerHTML = `
    <header class="page-header mb-4 pb-3"><p class="text-uppercase small mb-1 text-secondary">Análisis</p><h1 class="h2 mb-0">Reportes</h1></header>
    <div id="alertas"></div>

    <section class="panel p-4 mb-4"><h2 class="h5 mb-3">Ocupación</h2>
        <form id="formOcupacion" class="row g-3 align-items-end"><div id="camposOcupacion" class="col-12 row g-3"></div>
            <div class="col-12"><button class="btn btn-primary" type="submit">Generar reporte</button></div></form>
        <div id="resOcupacion" class="mt-3"></div></section>

    <section class="panel p-4 mb-4"><h2 class="h5 mb-3">Ingresos</h2>
        <form id="formIngresos" class="row g-3 align-items-end"><div id="camposIngresos" class="col-12 row g-3"></div>
            <div class="col-12"><button class="btn btn-primary" type="submit">Generar reporte</button></div></form>
        <div id="resIngresos" class="mt-3"></div></section>

    <section class="panel p-4 mb-4"><div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0">Deudores (morosidad)</h2><button class="btn btn-outline-primary btn-sm" id="btnMorosidad">Actualizar</button></div>
        <div id="resMorosidad"></div></section>`;

function enColumnas(id) { document.getElementById(id).classList.add('row'); }
async function montarRango(idContenedor, campos, prefijo, desde, hasta) {
    const cont = document.getElementById(idContenedor);
    await montarCampos(cont, campos, prefijo, { desde: fechaIso(desde), hasta: fechaIso(hasta) });
    cont.querySelectorAll('.mb-3').forEach(d => { d.classList.remove('mb-3'); d.classList.add('col-md-4'); });
    return cont;
}

(async () => {
    const contOcu = await montarRango('camposOcupacion', camposOcupacion, 'o-', mesInicio, mesSiguiente);
    const contIng = await montarRango('camposIngresos', camposIngresos, 'i-', new Date(hoy.getFullYear(), 0, 1), hoy);

    document.getElementById('formOcupacion').addEventListener('submit', async ev => {
        ev.preventDefault();
        const v = leerCampos(contOcu, camposOcupacion);
        const p = new URLSearchParams({ desde: v.desde, hasta: v.hasta });
        if (v.propiedadId) p.append('propiedadId', v.propiedadId);
        try {
            const filas = await api('GET', `/api/reportes/ocupacion?${p}`);
            document.getElementById('resOcupacion').innerHTML = filas.length ? `
                <div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Propiedad</th><th>Unidades</th><th>Noches reservadas</th><th>Noches disponibles</th><th style="min-width:180px">Ocupación</th></tr></thead><tbody>
                ${filas.map(f => `<tr><td>#${f.idPropiedad} · ${esc(f.tituloPropiedad)}</td><td>${f.unidadesAlquilables}</td><td>${f.nochesReservadas}</td><td>${f.nochesTotales}</td>
                    <td><div class="progress" role="progressbar"><div class="progress-bar" style="width:${Math.min(f.porcentajeOcupacion, 100)}%;background:var(--aqua)">${f.porcentajeOcupacion}%</div></div></td></tr>`).join('')}
                </tbody></table></div>` : '<p class="text-secondary mb-0">No hay propiedades registradas.</p>';
        } catch (e) { showError(e); }
    });

    document.getElementById('formIngresos').addEventListener('submit', async ev => {
        ev.preventDefault();
        const v = leerCampos(contIng, camposIngresos);
        const p = new URLSearchParams({ desde: v.desde, hasta: v.hasta });
        if (v.propiedadId) p.append('propiedadId', v.propiedadId);
        try {
            const r = await api('GET', `/api/reportes/ingresos?${p}`);
            const metodos = Object.entries(r.ingresosPorMetodoPago);
            document.getElementById('resIngresos').innerHTML = `
                <div class="row g-3 mb-3">
                    <div class="col-6 col-md-3"><div class="panel p-3 text-center"><div class="small text-secondary">Total de ingresos</div><div class="kpi">${money(r.totalIngresos)}</div></div></div>
                    <div class="col-6 col-md-3"><div class="panel p-3 text-center"><div class="small text-secondary">Pagos recibidos</div><div class="kpi">${r.cantidadPagos}</div></div></div>
                </div>
                ${metodos.length ? `<table class="table table-sm w-auto mb-0"><thead><tr><th>Método de pago</th><th class="text-end">Monto</th></tr></thead><tbody>
                    ${metodos.map(([m, t]) => `<tr><td>${esc(humanize(m))}</td><td class="text-end">${money(t)}</td></tr>`).join('')}</tbody></table>`
                    : '<p class="text-secondary mb-0">No hay pagos liquidados en ese periodo.</p>'}`;
        } catch (e) { showError(e); }
    });

    async function morosidad() {
        try {
            const filas = await api('GET', '/api/reportes/morosidad');
            document.getElementById('resMorosidad').innerHTML = filas.length ? `
                <div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Cliente</th><th>Contacto</th><th class="text-end">Adeudo</th><th>Pagos vencidos</th><th>Vencido desde</th><th>Días de atraso</th></tr></thead><tbody>
                ${filas.map(m => `<tr><td>${esc(m.nombreCliente)}</td><td class="small">${esc(m.email)}<br>${esc(m.telefono || '')}</td>
                    <td class="text-end"><strong>${money(m.montoAdeudado)}</strong></td><td>${m.cantidadPagosVencidos}</td><td>${fecha(m.vencimientoMasAntiguo)}</td>
                    <td><span class="badge text-bg-danger">${m.diasMaximoVencido} días</span></td></tr>`).join('')}
                </tbody></table></div>` : '<p class="text-success mb-0">No hay clientes con pagos vencidos.</p>';
        } catch (e) { showError(e); }
    }
    document.getElementById('btnMorosidad').addEventListener('click', morosidad);
    document.getElementById('formOcupacion').requestSubmit();
    document.getElementById('formIngresos').requestSubmit();
    morosidad();
})();
    </script>
</body>
</html>
